<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat – Leitstand</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #ffffff; --bg-side: #f6f5f3; --bg-soft: #eeede9; --bg-user: #e7edfb;
  --fg: #1c1c1a; --fg-soft: #6b6a66; --border: #e0ded9; --accent: #2f6fde; --danger: #c43c3c;
  --code-bg: #f7f6f4;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1b; --bg-side: #151514; --bg-soft: #2a2a28; --bg-user: #25324b;
    --fg: #e8e6e1; --fg-soft: #9d9b96; --border: #363531; --accent: #6f9ff5; --danger: #e46f6f;
    --code-bg: #121211;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { display: flex; background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; }
button:hover:not(:disabled) { border-color: var(--fg-soft); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
a.back { color: var(--fg-soft); text-decoration: none; font-size: 13px; padding: 2px 4px; }
a.back:hover { color: var(--fg); }
button.stop { background: var(--danger); border-color: var(--danger); color: #fff; }
button.ghost { background: none; border-color: transparent; color: var(--fg-soft); padding: 2px 8px; font-size: 13px; }
button.ghost:hover:not(:disabled) { color: var(--fg); background: var(--bg-soft); border-color: transparent; }
select, input, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; min-width: 0; }
code, pre { font: 13px/1.5 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }

#sidebar { width: 260px; flex-shrink: 0; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; padding: 12px; }
#chat-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
#chat-list li { display: flex; align-items: center; gap: 2px; border-radius: 8px; padding: 5px 4px 5px 10px; cursor: pointer; font-size: 14px; }
#chat-list li:hover, #chat-list li.active { background: var(--bg-soft); }
#chat-list li.active { font-weight: 600; }
#chat-list .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#chat-list li button { visibility: hidden; padding: 0 6px; }
#chat-list li:hover button { visibility: visible; }
body.side-toggled #sidebar { display: none; }

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
#model { max-width: 300px; }
#caps { color: var(--fg-soft); font-size: 13px; }
.spacer { flex: 1; }
#settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-side); }
#settings label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--fg-soft); }
#settings .wide { grid-column: 1 / -1; }
#settings textarea { resize: vertical; min-height: 60px; color: var(--fg); }
#settings input, #settings select { color: var(--fg); }

#messages { flex: 1; overflow-y: auto; padding: 24px 16px 8px; }
.msg { max-width: 820px; margin: 0 auto 22px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .bubble { background: var(--bg-user); border-radius: 16px; padding: 8px 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 4px; color: var(--fg-soft); font-size: 12px; opacity: 0; transition: opacity .15s; }
.msg:hover .meta, .msg:last-child .meta { opacity: 1; }
.meta .stats { margin-right: 6px; }
.images { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.images img { max-height: 180px; max-width: 260px; border-radius: 8px; display: block; }
.error { color: var(--danger); font-size: 14px; }
.error:empty { display: none; }
details.thinking { border-left: 3px solid var(--border); padding-left: 12px; margin-bottom: 12px; color: var(--fg-soft); font-size: 14px; }
details.thinking summary { cursor: pointer; user-select: none; margin-bottom: 4px; }
.typing::after { content: "●"; animation: pulse 1s ease-in-out infinite; color: var(--fg-soft); }
@keyframes pulse { 50% { opacity: .2; } }
.empty { text-align: center; color: var(--fg-soft); margin-top: 18vh; }
.empty h2 { color: var(--fg); font-weight: 600; margin-bottom: 4px; }

.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md blockquote, .md .table, .md .code { margin: 0 0 .8em; }
.md ul, .md ol { padding-left: 1.6em; }
.md li > ul, .md li > ol { margin: .2em 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.1em 0 .5em; line-height: 1.3; }
.md h1 { font-size: 1.45em; } .md h2 { font-size: 1.3em; } .md h3 { font-size: 1.15em; } .md h4, .md h5, .md h6 { font-size: 1em; }
.md code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.md .code { border: 1px solid var(--border); border-radius: 10px; background: var(--code-bg); overflow: hidden; }
.md .code-head { display: flex; justify-content: space-between; align-items: center; padding: 3px 4px 3px 12px; border-bottom: 1px solid var(--border); color: var(--fg-soft); font-size: 12px; }
.md pre { margin: 0; padding: 12px; overflow-x: auto; }
.md pre code { background: none; border: 0; padding: 0; overflow-wrap: normal; }
.md blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--fg-soft); }
.md .table { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 14px; }
.md th, .md td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.md th { background: var(--bg-soft); }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 1.2em 0; }

#composer { width: 100%; max-width: 852px; margin: 0 auto; padding: 0 16px 14px; }
#composer .box { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg); }
#composer .box:focus-within { border-color: var(--fg-soft); }
#composer.drag .box { border-color: var(--accent); border-style: dashed; }
#input { border: 0; outline: none; resize: none; background: none; padding: 4px 6px; max-height: 240px; }
#composer .row { display: flex; align-items: center; gap: 6px; }
#composer .hint { color: var(--fg-soft); font-size: 12px; }
#attachments { display: flex; flex-wrap: wrap; gap: 6px; }
#attachments .thumb { position: relative; }
#attachments img { height: 64px; border-radius: 8px; display: block; }
#attachments .thumb button { position: absolute; top: -6px; right: -6px; padding: 0 6px; border-radius: 10px; font-size: 11px; background: var(--bg-soft); }
#attachments .chip { display: flex; align-items: center; gap: 2px; align-self: center; padding: 2px 2px 2px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-soft); font-size: 13px; }
.files { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; white-space: normal; }
details.file { padding: 3px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 13px; }
details.file summary { cursor: pointer; }
details.file pre { max-height: 320px; overflow: auto; margin: 6px 0 2px; white-space: pre; }

dialog { width: min(560px, 92vw); padding: 18px 20px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); color: var(--fg); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.dialog-head h3 { margin: 0; }
#model-list { list-style: none; margin: 0 0 14px; padding: 0; max-height: 50vh; overflow-y: auto; }
#model-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
#model-list .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
#model-list .info { color: var(--fg-soft); font-size: 13px; }
#pull-form { display: flex; gap: 8px; }
#pull-form input { flex: 1; }
#pull-progress { width: 100%; margin-top: 10px; }
#pull-status { color: var(--fg-soft); font-size: 13px; margin-top: 6px; min-height: 1.4em; }
.muted { color: var(--fg-soft); font-size: 13px; }

#toast { white-space: pre-line; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); max-width: 90vw; background: var(--danger); color: #fff; padding: 8px 16px; border-radius: 8px; z-index: 20; }

@media (max-width: 760px) {
  #sidebar { position: fixed; inset: 0 auto 0 0; z-index: 10; display: none; box-shadow: 0 0 24px rgb(0 0 0 / .3); }
  body.side-toggled #sidebar { display: flex; }
  #caps, #composer .hint { display: none; }
}
</style>
</head>
<body>
<aside id="sidebar">
  <a href="/" class="back" title="Zurück zum Leitstand">← Leitstand</a>
  <button id="new-chat" class="primary">+ Neuer Chat</button>
  <ul id="chat-list"></ul>
</aside>

<main>
  <header>
    <button id="toggle-sidebar" class="ghost" title="Seitenleiste ein-/ausblenden">☰</button>
    <select id="model" title="Modell"></select>
    <span id="caps"></span>
    <span class="spacer"></span>
    <button id="export" class="ghost" title="Chat als Markdown speichern">Export</button>
    <button id="toggle-settings" class="ghost">Einstellungen</button>
    <button id="open-models" class="ghost">Modelle</button>
  </header>

  <section id="settings" hidden>
    <label class="wide">System-Prompt (gilt für diesen Chat, neue Chats übernehmen den zuletzt gesetzten)
      <textarea id="system" placeholder="z. B. Du bist ein hilfreicher Assistent. Antworte auf Deutsch."></textarea>
    </label>
    <label>Temperatur
      <input id="temperature" type="number" min="0" max="2" step="0.1" placeholder="Standard">
    </label>
    <label>Kontextlänge (num_ctx)
      <input id="num_ctx" type="number" min="256" step="1024" placeholder="Standard">
    </label>
    <label>Thinking
      <select id="think">
        <option value="">Standard</option>
        <option value="on">An</option>
        <option value="off">Aus</option>
        <option value="low">Niedrig</option>
        <option value="medium">Mittel</option>
        <option value="high">Hoch</option>
      </select>
    </label>
  </section>

  <div id="messages"></div>

  <form id="composer">
    <div class="box">
      <div id="attachments" hidden></div>
      <textarea id="input" rows="1" placeholder="Nachricht…" autofocus></textarea>
      <div class="row">
        <button type="button" id="attach" class="ghost">＋ Datei</button>
        <input type="file" id="file" multiple hidden>
        <span class="spacer"></span>
        <span class="hint">Enter senden · Shift+Enter neue Zeile · Esc stoppt</span>
        <button type="submit" id="send" class="primary">Senden</button>
      </div>
    </div>
  </form>
</main>

<dialog id="models-dialog">
  <form method="dialog" class="dialog-head">
    <h3>Modelle</h3>
    <button class="ghost" title="Schließen">✕</button>
  </form>
  <ul id="model-list"></ul>
  <form id="pull-form">
    <input id="pull-name" placeholder="Modell herunterladen, z. B. qwen3:8b" required>
    <button id="pull-btn" class="primary">Herunterladen</button>
  </form>
  <progress id="pull-progress" max="1" hidden></progress>
  <div id="pull-status"></div>
  <p class="muted">Verfügbare Modelle stehen unter ollama.com/library.</p>
</dialog>

<div id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s)
const el = (tag, cls, text) => {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text != null) e.textContent = text
  return e
}
const esc = s => s.replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c])
const gb = b => (b / 1e9).toFixed(b < 1e10 ? 2 : 1) + ' GB'

let settings = {model: '', temperature: '', num_ctx: '', think: '', system: ''}
try { Object.assign(settings, JSON.parse(localStorage.getItem('ollama-chat') || '{}')) } catch {}
const saveSettings = () => localStorage.setItem('ollama-chat', JSON.stringify(settings))

let chats = []      // sidebar entries: {id, title, updated}
let chat = null     // the open chat
let models = []
const modelInfo = {}
let abort = null    // AbortController of the running generation
let pullAbort = null
let canSeeImages = true
let pendingImages = []  // data URLs for the next message
let pendingFiles = []   // {name, content} text attachments for the next message

// ---------- Markdown ----------

const BLOCK_START = /^\s*(```|~~~|#{1,6}\s|>|([-*+]|\d+[.)])\s+)|^\s*([-*_])(\s*\3){2,}\s*$/
const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)/
const TABLE_SEP = /^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-*:?\s*$/
const link = (href, text) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${text}</a>`

function inline(s) {
  const codes = []
  s = s.replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*(?!\s)(.+?)(?<!\s)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/(^|[^_\w])_(?!\s)(.+?)(?<!\s)_(?!\w)/g, '$1<em>$2</em>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, h) => link(h, t))
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]*[^\s<).,:;!?])/g, (_, p, h) => p + link(h, h))
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`)
}

function codeBlock(code, lang) {
  return `<div class="code"><div class="code-head"><span>${esc(lang || 'code')}</span>` +
    `<button type="button" class="ghost copy-code">Kopieren</button></div><pre><code>${esc(code)}</code></pre></div>`
}

function list(lines, i) {
  const items = []
  while (i < lines.length) {
    const line = lines[i], m = line.match(LIST_ITEM)
    if (m) {
      items.push({indent: m[1].replace(/\t/g, '    ').length, ordered: /\d/.test(m[2]), start: parseInt(m[2]), text: m[3]})
    } else if (line.trim() && /^\s/.test(line) && !/^\s*(```|~~~)/.test(line)) {
      items.at(-1).text += '\n' + line.trim()
    } else if (!(!line.trim() && LIST_ITEM.test(lines[i + 1] || ''))) {
      break
    }
    i++
  }
  let html = ''
  const stack = []
  for (const it of items) {
    while (stack.length && it.indent < stack.at(-1).indent) html += `</li></${stack.pop().tag}>`
    if (!stack.length || it.indent > stack.at(-1).indent) {
      const tag = it.ordered ? 'ol' : 'ul'
      html += `<${tag}${it.ordered && it.start !== 1 ? ` start="${it.start}"` : ''}>`
      stack.push({indent: it.indent, tag})
    } else {
      html += '</li>'
    }
    html += `<li>${inline(it.text).replace(/\n/g, '<br>')}`
  }
  while (stack.length) html += `</li></${stack.pop().tag}>`
  return [html, i]
}

function table(lines, i) {
  // pipes inside code spans or escaped as \| don't split cells
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '')
    .replace(/`[^`]*`|\\\|/g, s => s.replace(/\\?\|/g, '\u0001')).split('|')
    .map(c => c.trim().replace(/\u0001/g, '|'))
  const align = cells(lines[i + 1]).map(c => c.endsWith(':') ? (c.startsWith(':') ? 'center' : 'right') : '')
  const row = (l, tag) => '<tr>' + cells(l).map((c, j) =>
    `<${tag}${align[j] ? ` style="text-align:${align[j]}"` : ''}>${inline(c)}</${tag}>`).join('') + '</tr>'
  let html = `<div class="table"><table><thead>${row(lines[i], 'th')}</thead><tbody>`
  for (i += 2; i < lines.length && lines[i].includes('|'); i++) html += row(lines[i], 'td')
  return [html + '</tbody></table></div>', i]
}

function markdown(src) {
  const lines = src.replace(/\r\n?/g, '\n').split('\n')
  let html = '', i = 0, m
  while (i < lines.length) {
    const line = lines[i]
    if ((m = line.match(/^(\s*)(`{3,}|~{3,})\s*([^\s`]*)/))) {
      const code = [], indent = new RegExp(`^ {0,${m[1].length}}`)
      for (i++; i < lines.length && !lines[i].trim().startsWith(m[2]); i++) code.push(lines[i].replace(indent, ''))
      html += codeBlock(code.join('\n'), m[3])
      i++
    } else if (!line.trim()) {
      i++
    } else if ((m = line.match(/^\s*(#{1,6})\s+(.*?)(\s+#+)?\s*$/))) {
      html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`
      i++
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
      html += '<hr>'
      i++
    } else if (/^\s*>/.test(line)) {
      const quote = []
      while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(lines[i++].replace(/^\s*> ?/, ''))
      html += `<blockquote>${markdown(quote.join('\n'))}</blockquote>`
    } else if (line.includes('|') && TABLE_SEP.test(lines[i + 1] || '')) {
      [m, i] = table(lines, i)
      html += m
    } else if (LIST_ITEM.test(line)) {
      [m, i] = list(lines, i)
      html += m
    } else {
      const para = [lines[i++]]
      while (i < lines.length && lines[i].trim() && !BLOCK_START.test(lines[i])) para.push(lines[i++])
      html += `<p>${para.map(inline).join('<br>')}</p>`
    }
  }
  return html
}

// Older models/servers put the reasoning into the content as <think>…</think>.
function splitThink(text) {
  const m = text.match(/^\s*<think>([\s\S]*?)(?:<\/think>|$)/)
  return m ? [m[1].trim(), text.slice(m[0].length).trimStart()] : ['', text]
}

// ---------- Server ----------

// Every request carries the Leitstand's header: the server refuses anything
// that writes without it, so a foreign page cannot send it here.
function api(url, opts = {}) {
  return fetch(url, {...opts, headers: {...opts.headers, 'X-Leitstand': '1'}})
}

async function json(url, opts) {
  const res = await api(url, opts)
  const data = res.status === 204 ? null : await res.json().catch(() => null)
  if (!res.ok) throw new Error(data?.error || `${res.status} ${res.statusText}`)
  return data
}

async function* ndjson(res) {
  if (!res.ok) throw new Error((await res.json().catch(() => null))?.error || `${res.status} ${res.statusText}`)
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader()
  let buf = ''
  for (;;) {
    const {value, done} = await reader.read()
    if (done) break
    buf += value
    let n
    while ((n = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, n).trim()
      buf = buf.slice(n + 1)
      if (!line) continue
      const obj = JSON.parse(line)
      if (obj.error) throw new Error(obj.error)
      yield obj
    }
  }
}

function toast(text) {
  const t = $('#toast')
  t.textContent = text
  t.hidden = false
  clearTimeout(toast.timer)
  toast.timer = setTimeout(() => t.hidden = true, 6000)
}

// ---------- Models ----------

async function loadModels() {
  try {
    models = (await json('api/tags')).models.sort((a, b) => a.name.localeCompare(b.name))
  } catch (e) {
    models = []
    toast(e.message)
  }
  const sel = $('#model')
  sel.replaceChildren(...models.map(m => new Option(m.name, m.name)))
  if (!models.length) sel.append(new Option('Kein Modell installiert', ''))
  await selectModel(chat?.model || settings.model)
  renderModelList()
}

async function selectModel(name) {
  const sel = $('#model')
  if (models.some(m => m.name === name)) sel.value = name
  const model = sel.value
  if (model) {
    settings.model = model
    saveSettings()
  }
  $('#input').placeholder = model ? `Nachricht an ${model}…` : 'Erst ein Modell herunterladen (oben rechts: Modelle)'
  let info = null
  if (model) {
    info = modelInfo[model] ??= await json('api/show', {method: 'POST', body: JSON.stringify({model})}).catch(() => ({}))
  }
  const caps = info?.capabilities
  const has = c => !caps || caps.includes(c)  // unknown capabilities: don't block anything
  const ctxKey = Object.keys(info?.model_info || {}).find(k => k.endsWith('.context_length'))
  const ctx = ctxKey && info.model_info[ctxKey]
  canSeeImages = has('vision')
  $('#attach').disabled = !model
  $('#attach').title = `Text-, Code- und PDF-Dateien${canSeeImages ? ' oder Bilder' : ''} anhängen (auch per Einfügen oder Drag & Drop)`
  $('#think').disabled = !has('thinking')
  $('#num_ctx').placeholder = ctx ? `Standard (max. ${ctx})` : 'Standard'
  $('#caps').textContent = [
    info?.details?.parameter_size, info?.details?.quantization_level,
    ...(caps || []).filter(c => c !== 'completion').map(c => ({vision: 'Bilder', thinking: 'Thinking', tools: 'Tools'})[c] || c),
    ctx && `${Math.round(ctx / 1024)}k Kontext`,
  ].filter(Boolean).join(' · ')
}

function renderModelList() {
  const ul = $('#model-list')
  ul.replaceChildren()
  if (!models.length) ul.append(el('li', 'muted', 'Noch keine Modelle installiert.'))
  for (const m of models) {
    const li = el('li')
    const use = el('button', 'ghost', 'Verwenden')
    use.onclick = () => { selectModel(m.name); $('#models-dialog').close() }
    li.append(el('span', 'name', m.name),
      el('span', 'info', [m.details?.parameter_size, m.details?.quantization_level, gb(m.size)].filter(Boolean).join(' · ')), use)
    ul.append(li)
  }
}

async function pull(model) {
  const bar = $('#pull-progress'), status = $('#pull-status'), btn = $('#pull-btn')
  pullAbort = new AbortController()
  btn.textContent = 'Abbrechen'
  btn.className = 'stop'
  bar.hidden = false
  bar.removeAttribute('value')
  status.textContent = 'Starte…'
  try {
    const res = await api('api/pull', {method: 'POST', body: JSON.stringify({model, stream: true}), signal: pullAbort.signal})
    for await (const p of ndjson(res)) {
      if (p.total) {
        bar.value = (p.completed || 0) / p.total
        status.textContent = `${p.status} – ${gb(p.completed || 0)} / ${gb(p.total)}`
      } else {
        status.textContent = p.status
      }
    }
    status.textContent = `${model} ist installiert.`
    await loadModels()
    await selectModel(models.find(m => m.name === model || m.name === model + ':latest')?.name)
    if (!chat.messages.length) renderChat()
  } catch (e) {
    status.textContent = e.name === 'AbortError' ? 'Abgebrochen.' : 'Fehler: ' + e.message
  } finally {
    pullAbort = null
    bar.hidden = true
    btn.textContent = 'Herunterladen'
    btn.className = 'primary'
  }
}

// ---------- Chats ----------

const newId = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('')
const closeSidebarOnMobile = () => matchMedia('(max-width: 760px)').matches && document.body.classList.remove('side-toggled')

async function loadChats() {
  chats = await json('chats').catch(e => (toast(e.message), []))
  renderChatList()
}

function newChat() {
  abort?.abort()
  chat = {id: newId(), title: '', model: $('#model').value, system: settings.system, messages: [], created: Date.now(), updated: Date.now()}
  history.replaceState(null, '', location.pathname)
  renderChat()
  closeSidebarOnMobile()
  $('#input').focus()
}

async function openChat(id) {
  abort?.abort()
  try {
    chat = await json('chats/' + id)
  } catch (e) {
    toast(e.message)
    return newChat()
  }
  history.replaceState(null, '', '#' + id)
  selectModel(chat.model)
  renderChat()
  closeSidebarOnMobile()
}

async function saveChat(c) {
  if (!c.messages.length) return
  try {
    await json('chats/' + c.id, {method: 'PUT', body: JSON.stringify(c)})
  } catch (e) {
    return toast('Speichern fehlgeschlagen: ' + e.message)
  }
  chats = [{id: c.id, title: c.title, updated: c.updated}, ...chats.filter(x => x.id !== c.id)].sort((a, b) => b.updated - a.updated)
  renderChatList()
  if (c === chat) history.replaceState(null, '', '#' + c.id)
}

async function renameChat(id) {
  const c = chat?.id === id ? chat : await json('chats/' + id).catch(e => toast(e.message))
  if (!c) return
  const title = prompt('Neuer Titel:', c.title)
  if (title == null) return
  c.title = title.trim()
  await saveChat(c)
  if (c === chat) document.title = `${c.title} – Chat – Leitstand`
}

async function deleteChat(id) {
  const c = chats.find(x => x.id === id)
  if (!confirm(`Chat „${c?.title || 'Ohne Titel'}“ löschen?`)) return
  try {
    await json('chats/' + id, {method: 'DELETE'})
  } catch (e) {
    return toast(e.message)
  }
  chats = chats.filter(x => x.id !== id)
  if (chat?.id === id) newChat()
  else renderChatList()
}

function renderChatList() {
  const ul = $('#chat-list')
  ul.replaceChildren()
  for (const c of chats) {
    const li = el('li', c.id === chat?.id ? 'active' : '')
    const title = el('span', 'title', c.title || 'Ohne Titel')
    title.title = c.title
    const ren = el('button', 'ghost', '✎')
    ren.title = 'Umbenennen'
    ren.onclick = e => { e.stopPropagation(); renameChat(c.id) }
    const del = el('button', 'ghost', '✕')
    del.title = 'Löschen'
    del.onclick = e => { e.stopPropagation(); deleteChat(c.id) }
    li.onclick = () => openChat(c.id)
    li.append(title, ren, del)
    ul.append(li)
  }
}

function exportChat() {
  if (!chat.messages.length) return
  const md = `# ${chat.title}\n\n` + chat.messages.map(m =>
    `**${m.role === 'user' ? 'Du' : m.model || 'Assistent'}:**\n\n${toOllama(m).content}`).join('\n\n---\n\n') + '\n'
  const a = el('a')
  a.href = URL.createObjectURL(new Blob([md], {type: 'text/markdown'}))
  a.download = (chat.title || 'chat').replace(/[\\/:*?"<>|]+/g, '_') + '.md'
  a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}

// ---------- Messages ----------

const messagesBox = $('#messages')
const nearBottom = () => messagesBox.scrollHeight - messagesBox.scrollTop - messagesBox.clientHeight < 80

function renderChat() {
  renderChatList()
  $('#system').value = chat.system || ''
  document.title = chat.title ? `${chat.title} – Chat – Leitstand` : 'Chat – Leitstand'
  messagesBox.replaceChildren(...chat.messages.map(renderMessage))
  if (!chat.messages.length) messagesBox.append(emptyState())
  messagesBox.scrollTop = messagesBox.scrollHeight
}

function emptyState() {
  const d = el('div', 'empty')
  if (models.length) {
    d.append(el('h2', '', 'Womit kann ich helfen?'), el('p', '', $('#model').value))
  } else {
    const b = el('button', 'primary', 'Modell herunterladen')
    b.onclick = openModels
    d.append(el('h2', '', 'Noch kein Modell installiert'), el('p', '', 'Lade zuerst ein Modell herunter.'), b)
  }
  return d
}

function action(label, fn) {
  const b = el('button', 'ghost', label)
  b.type = 'button'
  b.onclick = () => fn(b)
  return b
}

function renderMessage(m, i) {
  const wrap = el('div', 'msg ' + m.role)
  const bubble = el('div', 'bubble')
  if (m.images?.length) {
    const imgs = el('div', 'images')
    for (const src of m.images) {
      const img = el('img')
      img.src = src
      imgs.append(img)
    }
    bubble.append(imgs)
  }
  if (m.files?.length) {
    const files = el('div', 'files')
    for (const f of m.files) {
      const d = el('details', 'file')
      d.append(el('summary', '', `📄 ${f.name} · ${approxTokens(f.content)}`), el('pre', '', f.content))
      files.append(d)
    }
    bubble.append(files)
  }
  const meta = el('div', 'meta')
  if (m.role === 'user') {
    bubble.append(document.createTextNode(m.content))
    meta.append(action('Kopieren', b => copy(m.content, b)), action('Bearbeiten', () => editMessage(i)))
  } else {
    const think = el('details', 'thinking')
    think.append(el('summary'), el('div', 'md'))
    bubble.append(think, el('div', 'md content'), el('div', 'error'))
    meta.append(el('span', 'stats'), action('Kopieren', b => copy(splitThink(m.content)[1], b)))
    if (i === chat.messages.length - 1) meta.append(action('Neu generieren', regenerate))
  }
  wrap.append(bubble, meta)
  if (m.role === 'assistant') updateAssistant(wrap, m, false)
  return wrap
}

function updateAssistant(wrap, m, streaming) {
  const [tagged, content] = splitThink(m.content)
  const thinking = (m.thinking || '') + tagged
  const think = wrap.querySelector('.thinking')
  think.hidden = !thinking
  if (thinking) {
    think.querySelector('summary').textContent = streaming && !content ? 'Denkt nach…' : 'Gedankengang'
    think.querySelector('.md').innerHTML = markdown(thinking)
  }
  wrap.querySelector('.content').innerHTML = content || !streaming || thinking ? markdown(content) : '<span class="typing"></span>'
  wrap.querySelector('.error').textContent = m.error || ''
  wrap.querySelector('.stats').textContent = stats(m)
}

function stats(m) {
  const s = m.stats
  if (!s) return m.model || ''
  return [
    m.model,
    `${s.eval_count} Tokens`,
    s.eval_duration && `${(s.eval_count / s.eval_duration * 1e9).toFixed(1)} tok/s`,
    `Kontext ${(s.prompt_eval_count || 0) + s.eval_count}`,
    s.done_reason === 'length' && 'abgeschnitten (Limit erreicht)',
  ].filter(Boolean).join(' · ')
}

async function copy(text, btn) {
  try {
    await navigator.clipboard.writeText(text)
  } catch {
    // Over plain http from another machine there is no clipboard API; the old
    // way through a selected textarea still works there.
    const ta = Object.assign(document.createElement('textarea'), {value: text})
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0'
    document.body.append(ta)
    ta.select()
    const ok = document.execCommand('copy')
    ta.remove()
    if (!ok) return toast('Kopieren nicht möglich')
  }
  const label = btn.textContent
  btn.textContent = 'Kopiert ✓'
  setTimeout(() => btn.textContent = label, 1200)
}

function toOllama(m) {
  const files = (m.files || []).map(f => {
    const fence = '`'.repeat(Math.max(3, ...(f.content.match(/`{3,}/g) || []).map(s => s.length + 1)))
    return `Datei: ${f.name}\n${fence}\n${f.content}\n${fence}`
  })
  const content = m.role === 'assistant' ? splitThink(m.content)[1] : m.content
  const out = {role: m.role, content: [...files, content].filter(Boolean).join('\n\n')}
  if (m.images?.length) out.images = m.images.map(u => u.slice(u.indexOf(',') + 1))
  return out
}

async function send() {
  const text = $('#input').value.trim()
  if (abort || (!text && !pendingImages.length && !pendingFiles.length)) return
  if (!$('#model').value) return openModels()
  chat.messages.push({role: 'user', content: text, ...(pendingImages.length && {images: pendingImages}), ...(pendingFiles.length && {files: pendingFiles})})
  chat.title ||= text.split('\n')[0].slice(0, 60) || pendingFiles[0]?.name || 'Bild'
  $('#input').value = ''
  pendingImages = []
  pendingFiles = []
  renderAttachments()
  autosize()
  renderChat()
  await generate()
}

async function generate() {
  const c = chat, model = $('#model').value
  const history = c.messages.filter(m => m.role === 'user' || splitThink(m.content)[1].trim())
  const msg = {role: 'assistant', content: '', thinking: '', model}
  c.model = model
  c.messages.push(msg)
  messagesBox.querySelector('.empty')?.remove()
  let wrap = renderMessage(msg, c.messages.length - 1)
  messagesBox.append(wrap)
  messagesBox.scrollTop = messagesBox.scrollHeight

  const body = {
    model,
    messages: [...(c.system ? [{role: 'system', content: c.system}] : []), ...history.map(toOllama)],
    stream: true,
    options: {},
  }
  if (settings.temperature !== '') body.options.temperature = Number(settings.temperature)
  if (settings.num_ctx !== '') body.options.num_ctx = Number(settings.num_ctx)
  if (settings.think && !$('#think').disabled) body.think = {on: true, off: false}[settings.think] ?? settings.think

  const ctrl = abort = new AbortController()
  setBusy(true)
  let frame = 0
  const update = () => {
    frame = 0
    const stick = nearBottom()
    updateAssistant(wrap, msg, true)
    if (stick) messagesBox.scrollTop = messagesBox.scrollHeight
  }
  try {
    const res = await api('api/chat', {method: 'POST', body: JSON.stringify(body), signal: ctrl.signal})
    for await (const chunk of ndjson(res)) {
      msg.content += chunk.message?.content || ''
      msg.thinking += chunk.message?.thinking || ''
      if (chunk.done) {
        const {eval_count, eval_duration, prompt_eval_count, done_reason} = chunk
        msg.stats = {eval_count, eval_duration, prompt_eval_count, done_reason}
      }
      frame ||= requestAnimationFrame(update)
    }
  } catch (e) {
    if (e.name !== 'AbortError') msg.error = e.message
  } finally {
    cancelAnimationFrame(frame)
    if (abort === ctrl) {
      abort = null
      setBusy(false)
    }
    if (!msg.thinking) delete msg.thinking
    c.updated = Date.now()
    if (chat === c) {
      const stick = nearBottom()
      wrap.replaceWith(wrap = renderMessage(msg, c.messages.length - 1))
      if (stick) messagesBox.scrollTop = messagesBox.scrollHeight
    }
    await saveChat(c)
  }
}

function regenerate() {
  if (abort) return
  chat.messages.pop()
  renderChat()
  generate()
}

function editMessage(i) {
  if (abort) return
  const m = chat.messages[i]
  chat.messages.splice(i)
  $('#input').value = m.content
  pendingImages = m.images || []
  pendingFiles = m.files || []
  renderAttachments()
  renderChat()
  autosize()
  $('#input').focus()
}

function setBusy(busy) {
  const b = $('#send')
  b.textContent = busy ? 'Stopp' : 'Senden'
  b.className = busy ? 'stop' : 'primary'
}

// ---------- Composer ----------

function autosize() {
  const t = $('#input')
  t.style.height = 'auto'
  t.style.height = Math.min(t.scrollHeight, 240) + 'px'
}

const readFile = f => new Promise((resolve, reject) => {
  const r = new FileReader()
  r.onload = () => resolve(r.result)
  r.onerror = () => reject(r.error)
  r.readAsDataURL(f)
})

const approxTokens = s => `≈ ${Math.ceil(s.length / 3.5).toLocaleString('de-DE')} Tokens`

async function fileText(f) {
  if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
    const {text} = await json('pdf-text', {method: 'POST', body: f})
    if (!text) throw new Error('PDF enthält keinen Text (eingescannt?)')
    return text
  }
  const bytes = new Uint8Array(await f.arrayBuffer())
  if (bytes.subarray(0, 8000).includes(0)) throw new Error('Binärdatei – unterstützt werden Text, Code und PDF')
  try {
    return new TextDecoder('utf-8', {fatal: true}).decode(bytes)
  } catch {
    return new TextDecoder('windows-1252').decode(bytes)
  }
}

async function addFiles(files) {
  const errors = []
  for (const f of files) {
    try {
      if (f.type.startsWith('image/') && f.type !== 'image/svg+xml') {
        if (!canSeeImages) throw new Error(`${$('#model').value} versteht keine Bilder`)
        pendingImages.push(await readFile(f))
      } else {
        pendingFiles.push({name: f.name, content: await fileText(f)})
      }
    } catch (e) {
      errors.push(`${f.name}: ${e.message}`)
    }
  }
  renderAttachments()
  if (pendingFiles.length) errors.push(await contextWarning())
  if (errors.some(Boolean)) toast(errors.filter(Boolean).join('\n'))
}

// Ollama silently cuts off the start of a prompt that doesn't fit into the context window.
async function contextWarning() {
  const chars = chat.messages.reduce((n, m) => n + toOllama(m).content.length, 0) + pendingFiles.reduce((n, f) => n + f.content.length, 0)
  const tokens = Math.round(chars / 3.5), model = $('#model').value
  const ctx = Number(settings.num_ctx) || (await json('api/ps').catch(() => null))?.models?.find(m => m.name === model)?.context_length
  if (ctx && tokens > ctx * 0.9) {
    return `Achtung: ≈ ${tokens.toLocaleString('de-DE')} Tokens, aber nur ${ctx.toLocaleString('de-DE')} Kontext – Ollama schneidet den Anfang ab. Kontextlänge in den Einstellungen erhöhen.`
  }
}

function renderAttachments() {
  const box = $('#attachments')
  box.hidden = !pendingImages.length && !pendingFiles.length
  box.replaceChildren(
    ...pendingImages.map((src, i) => {
      const d = el('div', 'thumb'), img = el('img')
      img.src = src
      d.append(img, action('✕', () => { pendingImages.splice(i, 1); renderAttachments() }))
      return d
    }),
    ...pendingFiles.map((f, i) => {
      const d = el('div', 'chip', `📄 ${f.name} · ${approxTokens(f.content)}`)
      d.append(action('✕', () => { pendingFiles.splice(i, 1); renderAttachments() }))
      return d
    }),
  )
}

function openModels() {
  renderModelList()
  $('#models-dialog').showModal()
  $('#pull-name').focus()
}

// ---------- Wiring ----------

$('#composer').onsubmit = e => {
  e.preventDefault()
  if (abort) abort.abort()
  else send()
}
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault()
    send()
  }
})
$('#input').addEventListener('input', autosize)
$('#input').addEventListener('paste', e => {
  // pasted text wins; some apps put an image rendering of copied text on the clipboard as well
  if (e.clipboardData.files.length && !e.clipboardData.types.includes('text/plain') && !$('#attach').disabled) {
    e.preventDefault()
    addFiles([...e.clipboardData.files])
  }
})
const composer = $('#composer')
composer.addEventListener('dragover', e => { e.preventDefault(); composer.classList.add('drag') })
composer.addEventListener('dragleave', () => composer.classList.remove('drag'))
composer.addEventListener('drop', e => {
  e.preventDefault()
  composer.classList.remove('drag')
  if (!$('#attach').disabled) addFiles([...e.dataTransfer.files])
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && abort && !$('#models-dialog').open) abort.abort()
})

$('#attach').onclick = () => $('#file').click()
$('#file').onchange = e => { addFiles([...e.target.files]); e.target.value = '' }
$('#model').onchange = () => selectModel()
$('#new-chat').onclick = newChat
$('#export').onclick = exportChat
$('#toggle-sidebar').onclick = () => document.body.classList.toggle('side-toggled')
$('main').addEventListener('click', e => e.target.closest('#toggle-sidebar') || closeSidebarOnMobile())
$('#toggle-settings').onclick = () => $('#settings').hidden = !$('#settings').hidden
$('#open-models').onclick = openModels
$('#pull-form').onsubmit = e => {
  e.preventDefault()
  if (pullAbort) pullAbort.abort()
  else pull($('#pull-name').value.trim())
}
messagesBox.addEventListener('click', e => {
  const b = e.target.closest('.copy-code')
  if (b) copy(b.closest('.code').querySelector('code').textContent, b)
})

for (const id of ['temperature', 'num_ctx', 'think']) {
  const input = $('#' + id)
  input.value = settings[id]
  input.onchange = () => { settings[id] = input.value; saveSettings() }
}
$('#system').oninput = () => {
  chat.system = settings.system = $('#system').value
  saveSettings()
}

async function init() {
  chat = {id: newId(), title: '', model: '', system: settings.system, messages: [], created: Date.now(), updated: Date.now()}
  await Promise.all([loadModels(), loadChats()])
  const id = location.hash.slice(1)
  if (chats.some(c => c.id === id)) await openChat(id)
  else newChat()
}
init()
</script>
</body>
